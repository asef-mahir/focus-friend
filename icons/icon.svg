<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- Background circle -->
  <circle cx="64" cy="64" r="64" fill="#46765a"/>

  <!-- Stem -->
  <path d="M64 94 C64 94 56 76 56 60" stroke="#c8e6d0" stroke-width="3.5" stroke-linecap="round" fill="none" opacity="0.7"/>

  <!-- Main leaf (tilted, pointing upper-right) -->
  <path d="M64 90 C52 72 44 50 62 36 C80 50 80 72 64 90Z"
        fill="#e8f5eb" opacity="0.95"/>

  <!-- Leaf vein -->
  <path d="M64 90 C64 70 63 52 62 36"
        stroke="#46765a" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.5"/>

  <!-- Small accent leaf (right side) -->
