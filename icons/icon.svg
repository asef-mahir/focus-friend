        fill="#c8e6d0" opacity="0.85"/>

  <!-- Sparkle dot top-right -->
  <circle cx="85" cy="38" r="4" fill="#ffffff" opacity="0.6"/>
  <circle cx="92" cy="50" r="2.5" fill="#ffffff" opacity="0.35"/>
</svg>
