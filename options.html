<!doctype html>
<html lang="bn">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Focus Friend — Settings</title>
    <link rel="stylesheet" href="options.css">
    <script src="storage.js" defer></script>
    <script src="options.js" defer></script>
  </head>
  <body>
    <main class="page">
      <header class="intro">
        <p class="eyebrow">FOCUS FRIEND</p>
        <h1 id="onboarding"></h1>
        <p id="intro-copy" class="muted"></p>
      </header>

      <section class="settings-card" aria-labelledby="sites-heading">
        <div class="section-heading">
          <div>
            <h2 id="sites-heading"></h2>
            <p id="sites-description" class="muted"></p>
          </div>
          <div class="language-picker" aria-label="Language">
            <button type="button" data-language="bn">বাংলা</button>
            <button type="button" data-language="en">English</button>
          </div>
        </div>

        <form id="add-site-form" class="add-site-form">
          <label class="visually-hidden" for="site-input" id="site-input-label"></label>
          <input id="site-input" name="site" autocomplete="url">
          <button class="primary-button" type="submit" id="add-button"></button>
        </form>
        <p class="hint" id="youtube-warning"></p>
        <p class="form-message" id="form-message" role="status" aria-live="polite"></p>

        <ul id="site-list" class="site-list"></ul>
      </section>

      <section class="cooldown-card">
        <label for="debounce-input" id="cooldown-label"></label>
        <p class="muted" id="cooldown-description"></p>
        <div class="cooldown-control">
          <input id="debounce-input" type="number" min="1" max="240" step="1">
          <span id="minutes-label"></span>
        </div>
      </section>

      <p class="footer-note" id="footer-note"></p>
    </main>
  </body>
</html>
